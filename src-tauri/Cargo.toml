[package]
name = "autotappo"
version = "0.2.0"
description = "《鸣潮》官方桌宠 WuwaTappo 智能后台挂机助手"
authors = ["AutoTappo"]
edition = "2021"
rust-version = "1.77"

# 显式指定二进制产物名，让 cargo build 输出 AutoTappo.exe
[[bin]]
name = "AutoTappo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
# 只为了拿到 IUIAutomation / IUIAutomationElement 的虚表定义（COM 创建走自声明 FFI）。
# 这是 UIA 读取官方 WebView DOM 的核心依赖，无法用几个 GetProcAddress 手写替代。
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
